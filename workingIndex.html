<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />    
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      
      <div class="game-container">
        <canvas id="game" width="960" height="640"></canvas>
        
        <div class="overlay-hud-top-left">
          <div class="box task-box">
            <span class='wallet-label'>Task</span>
            <span id="task-list">...</span>
          </div>
            
        </div>

        <div class="overlay-hud-top-right">
          <div class="box wallet-box">
            <span class="wallet-label">Wallet</span>
            <span id="wallet-amount">0g</span>
          </div>
          <div class="clock-face">
           
            <div id="clock-hand" class="clock-hand"></div>
            <div class="clock-center"></div>
            <span id="days-left" class="days-left">15</span>
          </div>
        </div>
      </div>      
      <div class="inventory">
      
        <button class="tool-slot" data-tool="empty-hands">✋ Nothing</button>      
        <button class="tool-slot" data-tool="hoe"></button>
        <button class="tool-slot" data-tool="seeds">🌱 Seeds: </button>
        <button class="tool-slot" data-tool="watering-can">💧 Water Can: </button>
        <button class="tool-slot" data-tool="axe"></button>
        <button class="tool-slot" data-tool="min"></button>
        
        <div class="crop-counter">
          🧺 Collected: <span id="crop-count">0</span>
        </div>   
      </div>
    </div>    
    <script type="module" src="./src/game.js"></script>
  </body>
</html>
